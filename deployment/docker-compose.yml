services:
  # MongoDB база данных
  mongodb:
    image: mongo:7.0
    container_name: qwecms-mongodb
    restart: unless-stopped
    env_file:
      - ./config/.env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - qwecms-network

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: deployment/docker/backend/Dockerfile
    container_name: qwecms-backend
    restart: unless-stopped
    env_file:
      - ./config/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MongoDB=mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
    ports:
      - "5000:80"
    depends_on:
      - mongodb
    networks:
      - qwecms-network
    volumes:
      - ./logs:/app/logs

  # Frontend
  frontend:
    build:
      context: ..
      dockerfile: deployment/docker/frontend/Dockerfile
    container_name: qwecms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - qwecms-network

  # Nginx reverse proxy (опционально)
  nginx:
    image: nginx:alpine
    container_name: qwecms-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - qwecms-network
    profiles:
      - production

volumes:
  mongodb_data:
    driver: local

networks:
  qwecms-network:
    driver: bridge