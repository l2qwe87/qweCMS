<div class="mixin-form-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ getTitle() }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="mixinForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Имя миксина</mat-label>
          <input matInput formControlName="name" placeholder="base_content">
          <mat-error *ngIf="mixinForm.get('name')?.hasError('required')">
            Имя обязательно
          </mat-error>
          <mat-error *ngIf="mixinForm.get('name')?.hasError('pattern')">
            Имя должно содержать только буквы, цифры и подчеркивания, начинаться с буквы
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Отображаемое имя</mat-label>
          <input matInput formControlName="displayName" placeholder="Базовые поля контента">
          <mat-error *ngIf="mixinForm.get('displayName')?.hasError('required')">
            Отображаемое имя обязательно
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Описание</mat-label>
          <textarea matInput formControlName="description" rows="3"
                    placeholder="Описание миксина"></textarea>
        </mat-form-field>

        <div class="schema-section">
          <h3>JSON Schema</h3>
          <p class="hint">Здесь будет редактор JSON Schema</p>
          <pre>{{ mixinForm.get('schema')?.value | json }}</pre>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions align="end">
      <button mat-button type="button" (click)="onCancel()">Отмена</button>
      <button mat-raised-button color="primary" type="submit"
              [disabled]="!mixinForm.valid || loading"
              (click)="onSubmit()">
        {{ isEditMode ? 'Сохранить' : 'Создать' }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
